name: PHP lint and integrated regression checks

on:
  pull_request:
    paths:
      - 'crm/**'
      - '.github/workflows/php-smoke.yml'

permissions:
  contents: read

jobs:
  php-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test_only_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout pull-request code
        uses: actions/checkout@v4
      - name: Set up PHP and MySQL driver
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
      - name: Report PHP version
        run: php -v
      - name: Lint PHP source
        run: find crm -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run focused regression tests
        run: |
          if [ -f crm/tests/contract_items_test.php ]; then php crm/tests/contract_items_test.php; fi
          if [ -f crm/tests/deal_stage_history_test.php ]; then php crm/tests/deal_stage_history_test.php; fi
          if [ -f crm/tests/role_dashboard_test.php ]; then php crm/tests/role_dashboard_test.php; fi
          if [ -f crm/tests/sales_record_authorization_test.php ]; then php crm/tests/sales_record_authorization_test.php; fi
          if [ -f crm/tests/sales_record_authorization_behavior_test.php ]; then php crm/tests/sales_record_authorization_behavior_test.php; fi
          if [ -f crm/tests/ticket_attachment_security_test.php ]; then php crm/tests/ticket_attachment_security_test.php; fi
      - name: Run deal-stage MySQL integration tests
        if: hashFiles('crm/tests/deal_stage_history_mysql_test.php') != ''
        env:
          CRM_TEST_DB_HOST: 127.0.0.1
          CRM_TEST_DB_USER: root
          CRM_TEST_DB_PASSWORD: test_only_password
        run: php crm/tests/deal_stage_history_mysql_test.php
      - name: Run record-authorization MySQL integration tests
        env:
          CRM_TEST_DB_HOST: 127.0.0.1
          CRM_TEST_DB_USER: root
          CRM_TEST_DB_PASSWORD: test_only_password
        run: php crm/tests/record_authorization_mysql_test.php
      - name: Test itemization, invoices and amendments on MariaDB
        env:
          MYSQL_TEST_HOST: 127.0.0.1
          MYSQL_TEST_PORT: '3306'
          MYSQL_TEST_USER: root
          MYSQL_TEST_PASSWORD: test_only_password
        run: php crm/tests/contract_items_mysql_test.php
      - name: Test atomic contract-and-items creation and rollback
        env:
          MYSQL_TEST_HOST: 127.0.0.1
          MYSQL_TEST_PORT: '3306'
          MYSQL_TEST_USER: root
          MYSQL_TEST_PASSWORD: test_only_password
        run: php crm/tests/contract_sale_atomic_mysql_test.php
      - name: Test complete CRM schema and legacy contract compatibility
        env:
          MYSQL_TEST_HOST: 127.0.0.1
          MYSQL_TEST_PORT: '3306'
          MYSQL_TEST_USER: root
          MYSQL_TEST_PASSWORD: test_only_password
        run: php crm/tests/full_schema_contract_mysql_test.php
      - name: Test Mammut installation and delivery fulfillment
        env:
          MYSQL_TEST_HOST: 127.0.0.1
          MYSQL_TEST_PORT: '3306'
          MYSQL_TEST_USER: root
          MYSQL_TEST_PASSWORD: test_only_password
        run: php crm/tests/mammut_installation_mysql_test.php
      - name: Test real Mammut HTTP workflows, CSRF and receipt permissions
        env:
          MYSQL_TEST_HOST: 127.0.0.1
          MYSQL_TEST_PORT: '3306'
          MYSQL_TEST_USER: root
          MYSQL_TEST_PASSWORD: test_only_password
        run: php crm/tests/mammut_http_workflow_test.php
